services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: projectsale
      POSTGRES_USER: projectsale
      POSTGRES_PASSWORD: projectsale
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectsale -d projectsale"]
      interval: 5s
      timeout: 5s
      retries: 10
