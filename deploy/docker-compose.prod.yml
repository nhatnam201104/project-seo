# ProjectSale — stack production cho 1 VPS x86_64 (RAM ≤ 2GB).
# Chạy từ thư mục gốc repo:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d
# Chỉ Caddy mở cổng ra Internet (80/443). MySQL, Redis, backend, frontend chỉ nằm trong mạng nội bộ.

# Khác tên project của docker-compose.yml (dev, mặc định "projectsale") để không dùng chung volume/container.
name: projectsale-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4.10
    restart: unless-stopped
    mem_limit: ${MYSQL_MEM_LIMIT:-448m}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-projectsale}
      MYSQL_USER: ${MYSQL_USER:-projectsale}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      # Tiết kiệm RAM cho VPS nhỏ.
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
      - --skip-name-resolve
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [internal]
    logging: *default-logging
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP --host=127.0.0.1
          --user="$$MYSQL_USER" --password="$$MYSQL_PASSWORD"
          "$$MYSQL_DATABASE" --execute="SELECT 1" >/dev/null 2>&1
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.8.0-alpine
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-96m}
    environment:
      REDIS_USERNAME: ${REDIS_USERNAME:-projectsale}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - >-
        exec redis-server --appendonly yes
        --maxmemory 64mb --maxmemory-policy noeviction
        --user "$$REDIS_USERNAME" on ">$$REDIS_PASSWORD" allcommands allkeys
        --user default off
    volumes:
      - redis_data:/data
    networks: [internal]
    logging: *default-logging
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --user "$$REDIS_USERNAME" ping | grep -q PONG
      start_period: 5s
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
    image: ${REGISTRY:-projectsale}/backend:${TAG:-latest}
    restart: unless-stopped
    init: true
    mem_limit: ${BACKEND_MEM_LIMIT:-640m}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-projectsale}
      DB_USERNAME: ${MYSQL_USER:-projectsale}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ${REDIS_USERNAME:-projectsale}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?JWT_SECRET_BASE64 is required}
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET:?INTERNAL_PROXY_SECRET is required}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME is required}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD is required}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    logging: *default-logging

  frontend:
    build:
      context: ../frontend
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-ProjectSale}
        VITE_SITE_URL: https://${DOMAIN:?DOMAIN is required}
    image: ${REGISTRY:-projectsale}/frontend:${TAG:-latest}
    restart: unless-stopped
    init: true
    mem_limit: ${FRONTEND_MEM_LIMIT:-224m}
    environment:
      API_BASE_URL: http://backend:8081/api/v1
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET:?INTERNAL_PROXY_SECRET is required}
      COOKIE_SECURE: "true"
      # Đúng 1 reverse proxy (Caddy) đứng trước Node.
      TRUST_PROXY_HOPS: 1
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]
    logging: *default-logging

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    mem_limit: ${CADDY_MEM_LIMIT:-48m}
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Mount cả thư mục (không mount riêng file): khi deploy ghi đè Caddyfile,
      # container thấy bản mới và `caddy reload` áp dụng được.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    networks: [internal]
    logging: *default-logging

networks:
  internal:

volumes:
  mysql_data:
  redis_data:
  caddy_data:
  caddy_config:
