spring:
  application:
    name: projectsale-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/projectsale}
    username: ${DB_USERNAME:projectsale}
    password: ${DB_PASSWORD:projectsale}
    hikari:
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
        preserveInstants: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.type.preferred_uuid_jdbc_type: CHAR
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
server:
  error:
    include-message: never
  port: 8081
app:
  mail:
    from: ${MAIL_FROM:}
  jwt:
    secret-base64: ${JWT_SECRET_BASE64:b3d69d34ca1b729edfd8ba26f091ba994a3c5dc00dfcb6732f5a7f968f5aace6}
    issuer: projectsale-api
    audience: projectsale-web
    access-ttl: PT15M
    refresh-ttl: P30D
    clock-skew: PT60S

